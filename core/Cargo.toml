[package]
name = "pombo-correio-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.5"
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde"] }
getrandom = "0.4.3"
hex = "0.4.3"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "serde"] }
zeroize = { version = "1.9", features = ["derive"] }

# No browser não há `/dev/urandom`: a aleatoriedade vem do `crypto.getRandomValues`
# e o `getrandom` precisa de o saber em tempo de compilação. Sem isto o `core/`
# nem chega a compilar para wasm32 — e é a página do link que o exige.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

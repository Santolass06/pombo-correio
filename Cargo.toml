[workspace]
resolver = "3"
members = ["core", "rede", "cli", "ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
pombo-correio-core = { path = "core" }
pombo-correio-rede = { path = "rede" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Otimiza as DEPENDÊNCIAS mesmo em debug, mantendo o nosso código depurável e a
# compilar depressa. Sem isto, a transferência numa build de desenvolvimento
# (`npm run app`) cai para ~2 MB/s e fica inutilizável para ficheiros grandes.
#
# `opt-level` sozinho não chega: com `overflow-checks` e `debug-assertions`
# ligados, cada operação aritmética da cifra ChaCha20 é verificada, e ela faz
# milhões delas por bloco — foi o que segurou a decifração a ~2,8 MB/s. Desligar
# essas verificações **nas dependências** (não no nosso código) recupera a
# velocidade. A criptografia toda vive aqui, por isso é suficiente.
[profile.dev.package."*"]
opt-level = 3
overflow-checks = false
debug-assertions = false

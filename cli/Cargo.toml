[package]
name = "pombo-correio"
version.workspace = true
edition.workspace = true
license.workspace = true

# Binário curto de propósito: `pombo enviar ...` em vez do nome completo.
[[bin]]
name = "pombo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
pombo-correio-core = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal"] }
pombo-correio-rede = { workspace = true }

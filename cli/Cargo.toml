[package]
name = "pombo-correio"
version.workspace = true
edition.workspace = true
license.workspace = true

# Binário curto de propósito: `pombo enviar ...` em vez do nome completo.
[[bin]]
name = "pombo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.33"
hex = "0.4.3"
mdns-sd = "0.20.2"
pombo-correio-core = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal"] }

[package]
name = "pombo-correio-rede"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures-util = "0.3.33"
pombo-correio-core = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal"] }
hex = "0.4.3"
async-stream = "0.3.6"
bytes = "1.12.1"
mdns-sd = "0.20.2"

[dev-dependencies]
hex = "0.4.3"
pombo-correio-relay = { path = "../relay" }
# Para o teste do link poder fazer o que o browser faz, com o mesmo código.
pombo-correio-pagina = { path = "../pagina" }

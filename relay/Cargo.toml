[package]
name = "pombo-correio-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pombo-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.5.51", features = ["derive"] }
futures-util = "0.3.33"
getrandom = "0.3.4"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "json"] }
